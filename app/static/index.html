<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourPulse - Smart Sustainable Tourism</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js](https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js)"></script>
    <style>
        .badge-low { background-color: #059669; color: #ecfdf5; }
        .badge-moderate { background-color: #d97706; color: #fffbeb; }
        .badge-high { background-color: #dc2626; color: #fef2f2; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <header class="bg-slate-800 border-b border-slate-700 py-6 px-8 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black tracking-wide text-teal-400">⚡ TourPulse</h1>
                <p class="text-xs text-slate-400">AI-Powered Crowd Intelligence & Sustainable Travel</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-10">
        <!-- Real-Time Crowd Tracker Section -->
        <section>
            <h2 class="text-xl font-bold text-white mb-4">Real-Time Crowd Tracker</h2>
            <div id="destinationsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- AI Itinerary Generator Section -->
        <section class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-4">AI Sustainable Itinerary Generator</h2>
            <form id="itineraryForm" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Destination</label>
                    <input type="text" id="itineraryDest" required value="Kerala" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Days</label>
                    <input type="number" id="itineraryDays" required value="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Budget ($)</label>
                    <input type="number" id="itineraryBudget" required value="450" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Travel Style</label>
                    <select id="itineraryStyle" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none">
                        <option value="budget">Budget / Eco</option>
                        <option value="adventure">Adventure</option>
                    </select>
                </div>
                <div class="col-span-full">
                    <button type="submit" id="generateBtn" class="bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold px-6 py-2.5 rounded-lg text-sm transition">Generate Optimized Plan</button>
                </div>
            </form>
            <div id="itineraryOutput" class="hidden space-y-4 pt-4 border-t border-slate-700"></div>
        </section>

        <!-- Local Marketplace Section -->
        <section>
            <h2 class="text-xl font-bold text-white mb-4">Local Marketplace</h2>
            <div class="space-y-6">
                <div>
                    <h3 class="text-md font-semibold text-teal-400 mb-3">🌿 Certified Eco-Homestays</h3>
                    <div id="homestaysGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
                </div>
                <div>
                    <h3 class="text-md font-semibold text-teal-400 mb-3">🧭 Verified Local Guides</h3>
                    <div id="guidesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Floating Chat Widget -->
    <div id="chatDrawer" class="hidden fixed bottom-20 right-6 w-80 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl flex-col h-96 z-50">
        <div class="bg-slate-900 p-3 rounded-t-xl border-b border-slate-700 flex justify-between items-center">
            <span class="font-bold text-teal-400">AI Concierge</span>
            <button onclick="toggleChat()" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <div id="chatHistory" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
            <div class="text-slate-300 bg-slate-700 p-2 rounded-lg self-start">Hi! Ask me about crowd avoidance in Munnar, Hampi, Goa, or Leh.</div>
        </div>
        <div class="p-3 border-t border-slate-700 bg-slate-900 rounded-b-xl flex gap-2">
            <input type="text" id="chatInput" placeholder="Type here..." class="flex-1 bg-slate-800 text-white px-3 py-1.5 rounded outline-none text-sm border border-slate-700">
            <button onclick="sendChat()" class="bg-teal-500 text-slate-900 px-3 py-1.5 rounded font-bold text-sm">Send</button>
        </div>
    </div>
    <button onclick="toggleChat()" class="fixed bottom-6 right-6 bg-teal-500 text-slate-900 p-4 rounded-full shadow-lg font-black text-xl hover:bg-teal-400 z-50">💬</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDestinations();
            loadMarketplace();
            document.getElementById('itineraryForm').addEventListener('submit', handleItinerarySubmit);
        });

        function toggleChat() {
            const drawer = document.getElementById('chatDrawer');
            drawer.classList.toggle('hidden');
            drawer.classList.toggle('flex');
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            
            const history = document.getElementById('chatHistory');
            history.innerHTML += `<div class="text-slate-900 bg-teal-400 p-2 rounded-lg ml-auto max-w-[85%]">${msg}</div>`;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            try {
                const res = await axios.post('/api/concierge/chat', { message: msg });
                history.innerHTML += `<div class="text-slate-300 bg-slate-700 p-2 rounded-lg mr-auto max-w-[85%]">${res.data.response}</div>`;
            } catch (err) {
                history.innerHTML += `<div class="text-rose-400 bg-slate-700 p-2 rounded-lg mr-auto text-xs">Error reaching concierge.</div>`;
            }
            history.scrollTop = history.scrollHeight;
        }

        async function loadDestinations() {
            try {
                const res = await axios.get('/api/destinations');
                document.getElementById('destinationsGrid').innerHTML = res.data.map(d => `
                    <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-md">
                        <div class="p-5 space-y-3">
                            <div class="flex justify-between items-start">
                                <div><h3 class="font-bold text-lg text-white">${d.name}</h3><p class="text-xs text-slate-400">${d.location}</p></div>
                                <span class="px-2.5 py-1 text-xs font-bold rounded-full ${d.status_tag.toLowerCase() === 'low' ? 'badge-low' : (d.status_tag.toLowerCase() === 'high' ? 'badge-high' : 'badge-moderate')}">${d.status_tag}</span>
                            </div>
                            <p class="text-xs text-slate-300">${d.description}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function loadMarketplace() {
            try {
                const hRes = await axios.get('/api/vendors/homestays');
                document.getElementById('homestaysGrid').innerHTML = hRes.data.map(h => `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-sm">
                        <div class="font-bold text-white">${h.name}</div>
                        <div class="text-slate-400 text-xs mb-2">${h.region}</div>
                        <div class="font-bold text-teal-400">$${h.price_per_night}/night</div>
                        <div class="text-[10px] text-slate-300 mt-2">${h.amenities.join(', ')}</div>
                    </div>
                `).join('');

                const gRes = await axios.get('/api/vendors/guides');
                document.getElementById('guidesGrid').innerHTML = gRes.data.map(g => `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-sm">
                        <div class="flex justify-between font-bold text-white"><span>${g.name}</span><span class="text-amber-400">★ ${g.rating}</span></div>
                        <div class="text-slate-400 text-xs mb-2">${g.region}</div>
                        <div class="text-xs text-slate-300">${g.bio}</div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function handleItinerarySubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('generateBtn');
            const out = document.getElementById('itineraryOutput');
            btn.disabled = true;
            btn.innerText = "Generating...";
            out.classList.remove('hidden');

            try {
                const payload = {
                    destination: document.getElementById('itineraryDest').value,
                    days: parseInt(document.getElementById('itineraryDays').value),
                    budget: parseFloat(document.getElementById('itineraryBudget').value),
                    travel_style: document.getElementById('itineraryStyle').value
                };
                const res = await axios.post('/api/itinerary/generate', payload);
                out.innerHTML = res.data.days_plan.map(d => `
                    <div class="bg-slate-900 p-4 rounded-lg border border-slate-800">
                        <div class="font-bold text-teal-300 text-sm mb-1">Day ${d.day} - $${d.estimated_cost}</div>
                        <ul class="text-xs text-slate-300 list-disc list-inside">${d.activities.map(a => `<li>${a}</li>`).join('')}</ul>
                    </div>
                `).join('');
            } catch (err) {
                out.innerHTML = `<div class="text-rose-400 text-sm">Failed to generate itinerary.</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Optimized Plan";
            }
        }
    </script>
</body>
</html>
